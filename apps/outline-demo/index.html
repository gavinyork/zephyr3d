<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RenderGraph Object Outline</title>
    <style>
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #12151b; color: #edf2f7; font-family: ui-sans-serif, system-ui, sans-serif; }
      canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      #panel { position: absolute; top: 16px; left: 16px; z-index: 1; width: 280px; padding: 14px 16px; border: 1px solid rgba(255,255,255,.14); border-radius: 8px; background: rgba(20,24,31,.86); backdrop-filter: blur(8px); box-shadow: 0 8px 28px rgba(0,0,0,.28); }
      h1 { margin: 0 0 7px; font-size: 17px; }
      p { margin: 0 0 14px; color: #aeb8c5; font-size: 13px; line-height: 1.45; }
      label { display: flex; align-items: center; gap: 9px; margin-top: 9px; font-size: 13px; }
      input[type="range"] { flex: 1; accent-color: #ff941f; }
      input[type="checkbox"] { accent-color: #ff941f; }
      output { min-width: 34px; text-align: right; font-variant-numeric: tabular-nums; }
    </style>
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <section id="panel">
      <h1>RenderGraph object outline</h1>
      <p>The orange hull is a custom pipeline pass. It shares the scene depth, so the foreground sphere correctly occludes it.</p>
      <label><input id="outline-enabled" type="checkbox" checked /> Enable outline pass</label>
      <label>
        Width
        <input id="outline-width" type="range" min="0.01" max="0.25" step="0.01" value="0.10" />
        <output id="outline-width-value">0.10</output>
      </label>
    </section>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
