<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zephyr3D Hair Strand Demo</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #0e1013;
        color: #e9edf2;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
      }

      canvas {
        display: block;
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }

      #io {
        position: absolute;
        right: 12px;
        bottom: 12px;
        z-index: 10;
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 10px 12px;
        background: rgba(20, 24, 30, 0.82);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 6px;
        backdrop-filter: blur(8px);
        font-size: 13px;
      }

      #io label {
        display: flex;
        gap: 8px;
        align-items: center;
        color: #9aa6b2;
      }

      #io input[type='file'] {
        max-width: 210px;
        font-size: 12px;
        color: #cdd6e0;
      }

      #status {
        position: absolute;
        left: 12px;
        bottom: 12px;
        z-index: 10;
        padding: 10px 12px;
        background: rgba(20, 24, 30, 0.82);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 6px;
        backdrop-filter: blur(8px);
        font-size: 13px;
        color: #9aa6b2;
        max-width: 46ch;
        line-height: 1.5;
      }

      #status.error {
        color: #ff9c9c;
        border-color: rgba(255, 120, 120, 0.35);
      }
    </style>
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <div id="status">Loading&hellip;</div>
    <!-- Kept out of ImGui: a file picker needs a real DOM element to open the
         browser dialog. Dropping in a local .abc avoids the CDN round trip when
         iterating on a specific groom. -->
    <div id="io">
      <label>Alembic (.abc) <input id="abc-file" type="file" accept=".abc" /></label>
    </div>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
