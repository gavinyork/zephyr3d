<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zephyr3d Foliage</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
      }
      #ui {
        position: absolute;
        top: 8px;
        left: 8px;
        z-index: 10;
        display: flex;
        flex-direction: column;
        gap: 6px;
        width: 250px;
        padding: 8px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 6px;
        background: rgba(15, 20, 28, 0.78);
        color: #f4f7fb;
        color-scheme: dark;
        font:
          12px/1.25 system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
        backdrop-filter: blur(8px);
      }
      #ui label {
        display: flex;
        align-items: center;
        gap: 6px;
        white-space: nowrap;
      }
      #ui label > span:first-child {
        min-width: 54px;
      }
      #ui label > .value {
        min-width: 40px;
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      #ui input[type='range'] {
        flex: 1;
        min-width: 0;
        accent-color: #7fb2ff;
      }
      #ui input[type='range']:disabled {
        opacity: 0.4;
      }
      #ui input[type='checkbox'] {
        accent-color: #7fb2ff;
        cursor: pointer;
      }
      #ui .note {
        opacity: 0.7;
        white-space: normal;
      }
    </style>
  </head>
  <body>
    <canvas id="my-canvas"></canvas>
    <div id="ui" aria-label="Foliage options">
      <label>
        <span>Trees</span>
        <input id="count-range" type="range" min="0" max="20000" step="500" value="6000" />
        <span class="value" id="count-value"></span>
      </label>
      <label>
        <span>Cull</span>
        <input id="cull-range" type="range" min="50" max="500" step="10" />
        <span class="value" id="cull-value"></span>
      </label>
      <label>
        <span>Fade</span>
        <input id="fade-range" type="range" min="0" max="50" step="1" />
        <span class="value" id="fade-value"></span>
      </label>
      <label>
        <span>Shadows</span>
        <input id="shadow-check" type="checkbox" />
      </label>
      <div class="note" id="backend-note"></div>
      <div class="note">Sliders apply on release. Left drag: orbit. Wheel: zoom.</div>
    </div>
    <script type="module" src="js/tut-91.js"></script>
  </body>
</html>
