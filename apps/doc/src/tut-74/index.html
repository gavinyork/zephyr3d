<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zephyr3d Water Height Sampling</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
      }
      #ui {
        position: absolute;
        top: 8px;
        left: 8px;
        z-index: 10;
        display: flex;
        flex-direction: column;
        gap: 6px;
        width: 218px;
        padding: 8px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 6px;
        background: rgba(15, 20, 28, 0.78);
        color: #f4f7fb;
        /* Render the native dropdown popup and its scrollbar dark to match. */
        color-scheme: dark;
        font:
          12px/1.25 system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
        backdrop-filter: blur(8px);
      }
      #ui label {
        display: flex;
        align-items: center;
        gap: 6px;
        white-space: nowrap;
      }
      #ui label > span {
        min-width: 62px;
      }
      #ui select {
        flex: 1;
        min-width: 0;
        min-height: 22px;
        padding: 0 4px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 4px;
        /* Opaque: the popup list has nothing behind it, so a translucent
           background composites onto white and hides the inherited light text. */
        background: #222b36;
        color: inherit;
        font: inherit;
        cursor: pointer;
      }
      #ui option {
        background: #1b2430;
        color: #f4f7fb;
      }
      #ui input[type='checkbox'] {
        accent-color: #7fb2ff;
        cursor: pointer;
      }
      #ui input[type='range'] {
        flex: 1;
        min-width: 0;
        accent-color: #7fb2ff;
        cursor: pointer;
      }
      #status {
        position: absolute;
        right: 8px;
        top: 8px;
        z-index: 10;
        padding: 8px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 6px;
        background: rgba(15, 20, 28, 0.78);
        color: #f4f7fb;
        font:
          12px/1.4 ui-monospace,
          SFMono-Regular,
          Menlo,
          Consolas,
          monospace;
        white-space: pre;
        backdrop-filter: blur(8px);
      }
      #ui .note {
        opacity: 0.7;
        white-space: normal;
      }
    </style>
  </head>
  <body>
    <canvas id="my-canvas"></canvas>
    <div id="ui" aria-label="Water sampling options">
      <label>
        <span>Sampling</span>
        <input id="sampling-check" type="checkbox" checked />
      </label>
      <label>
        <span>Physics</span>
        <input id="physics-check" type="checkbox" checked />
      </label>
      <label>
        <span>Exact dots</span>
        <input id="reference-check" type="checkbox" />
      </label>
      <label>
        <span>Speed</span>
        <input id="speed-input" type="range" min="0" max="3" step="0.05" value="1" />
        <em id="speed-label">1.00</em>
      </label>
      <label>
        <span>Query</span>
        <input id="rate-input" type="range" min="1" max="60" step="1" value="30" />
        <em id="rate-label">30.0Hz</em>
      </label>
      <label>
        <span>GPU queue</span>
        <input id="inflight-input" type="range" min="0" max="4" step="1" value="2" />
        <em id="inflight-label">2 frames</em>
      </label>
      <label>
        <span>Ease</span>
        <input id="ease-input" type="range" min="0.02" max="1.5" step="0.01" value="0.25" />
        <em id="ease-label">0.25s</em>
      </label>
      <div class="note">
        With Physics on, each box is a rigid body held up by buoyancy: the water pushes on the
        submerged part, and that push is what rolls it back level. Off, the boxes ease towards
        the sampled surface instead, with Ease setting how long that takes.
      </div>
      <div class="note">Left drag: orbit. Wheel: zoom.</div>
    </div>
    <div id="status">starting</div>
    <script type="module" src="js/tut-74.js"></script>
  </body>
</html>
