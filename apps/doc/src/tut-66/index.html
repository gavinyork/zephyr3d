<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zephyr3d Water</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
      }
      #ui {
        position: absolute;
        top: 8px;
        left: 8px;
        z-index: 10;
        display: flex;
        flex-direction: column;
        gap: 6px;
        width: 200px;
        padding: 8px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 6px;
        background: rgba(15, 20, 28, 0.78);
        color: #f4f7fb;
        /* Render the native dropdown popup and its scrollbar dark to match. */
        color-scheme: dark;
        font:
          12px/1.25 system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
        backdrop-filter: blur(8px);
      }
      #ui label {
        display: flex;
        align-items: center;
        gap: 6px;
        white-space: nowrap;
      }
      #ui label > span {
        min-width: 48px;
      }
      #ui select {
        flex: 1;
        min-width: 0;
        min-height: 22px;
        padding: 0 4px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 4px;
        /* Opaque: the popup list has nothing behind it, so a translucent
           background composites onto white and hides the inherited light text. */
        background: #222b36;
        color: inherit;
        font: inherit;
        cursor: pointer;
      }
      #ui option {
        background: #1b2430;
        color: #f4f7fb;
      }
      #ui input[type='checkbox'] {
        accent-color: #7fb2ff;
        cursor: pointer;
      }
      #ui .note {
        opacity: 0.7;
        white-space: normal;
      }
    </style>
  </head>
  <body>
    <canvas id="my-canvas"></canvas>
    <div id="ui" aria-label="Water scene options">
      <label>
        <span>Scene</span>
        <select id="scene-select">
          <option value="ocean">Ocean</option>
          <option value="pool">Pool</option>
        </select>
      </label>
      <label>
        <span>Debug</span>
        <select id="debug-select"></select>
      </label>
      <label>
        <span>Pause</span>
        <input id="pause-check" type="checkbox" />
      </label>
      <label>
        <span>Dive</span>
        <input id="dive-check" type="checkbox" />
      </label>
      <label>
        <span>Shafts</span>
        <input id="godray-check" type="checkbox" checked />
      </label>
      <div class="note">Left drag: orbit. Wheel: zoom. Dive puts the camera under the surface.</div>
    </div>
    <script type="module" src="js/tut-66.js"></script>
  </body>
</html>
