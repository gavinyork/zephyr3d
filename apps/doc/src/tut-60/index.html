<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zephyr3D AnimationController - Marker Timing</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #16181d;
        color: #eef2f7;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
      }

      canvas {
        display: block;
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        outline: none;
      }

      #ui {
        position: absolute;
        top: 12px;
        left: 12px;
        z-index: 10;
        max-width: calc(100vw - 24px);
        pointer-events: none;
      }

      #ui .panel {
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 10px;
        background: rgba(24, 28, 34, 0.82);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 6px;
        backdrop-filter: blur(8px);
        pointer-events: auto;
      }

      #ui .title {
        font-size: 13px;
        font-weight: 600;
        color: #f1f5f9;
      }

      #ui .status {
        font-size: 12px;
        line-height: 1.4;
        color: #cbd5df;
        white-space: pre-wrap;
      }

      #ui .buttons {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      button {
        min-height: 32px;
        padding: 0 12px;
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 4px;
        background: #2b3138;
        color: #eef2f7;
        cursor: pointer;
        font: inherit;
      }

      button.active {
        background: #3d6f7f;
        border-color: #62a4b8;
      }
    </style>
  </head>
  <body>
    <div id="ui"></div>
    <canvas id="my-canvas" tabindex="0"></canvas>
    <script type="module" src="js/tut-60.js"></script>
  </body>
</html>
