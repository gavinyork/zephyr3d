<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zephyr3d Scene SDF</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
      }
      #ui {
        position: absolute;
        top: 8px;
        left: 8px;
        z-index: 10;
        display: flex;
        flex-direction: column;
        gap: 6px;
        width: 250px;
        padding: 8px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 6px;
        background: rgba(15, 20, 28, 0.78);
        color: #f4f7fb;
        color-scheme: dark;
        font:
          12px/1.25 system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
        backdrop-filter: blur(8px);
      }
      #ui label {
        display: flex;
        align-items: center;
        gap: 6px;
        white-space: nowrap;
      }
      #ui label > span {
        min-width: 72px;
      }
      #ui select,
      #ui input[type='range'] {
        flex: 1;
        min-width: 0;
      }
      #ui select {
        min-height: 22px;
        padding: 0 4px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 4px;
        background: #222b36;
        color: inherit;
        font: inherit;
        cursor: pointer;
      }
      #ui option {
        background: #1b2430;
        color: #f4f7fb;
      }
      #ui input[type='range'],
      #ui input[type='checkbox'] {
        accent-color: #7fb2ff;
        cursor: pointer;
      }
      #ui pre {
        margin: 0;
        font:
          11px/1.35 ui-monospace,
          SFMono-Regular,
          Menlo,
          Consolas,
          monospace;
        white-space: pre-wrap;
      }
      #ui .note {
        opacity: 0.7;
        white-space: normal;
      }
    </style>
  </head>
  <body>
    <canvas id="my-canvas"></canvas>
    <div id="ui" aria-label="Scene SDF options">
      <label>
        <span>Distance field</span>
        <input id="field-check" type="checkbox" checked />
      </label>
      <label>
        <span>Ring sdfMode</span>
        <select id="mode-select">
          <option value="dynamic">dynamic</option>
          <option value="auto">auto</option>
          <option value="static">static</option>
          <option value="none">none</option>
        </select>
      </label>
      <label>
        <span>Move ring</span>
        <input id="move-check" type="checkbox" checked />
      </label>
      <label>
        <span>Brick budget</span>
        <select id="budget-select">
          <option value="32">32</option>
          <option value="128">128</option>
          <option value="512" selected>512</option>
          <option value="2048">2048</option>
        </select>
      </label>
      <pre id="stats"></pre>
      <div class="note" id="backend-note"></div>
      <div class="note">Left drag: orbit. Wheel: zoom.</div>
    </div>
    <script type="module" src="js/tut-93.js"></script>
  </body>
</html>
