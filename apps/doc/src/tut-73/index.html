<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zephyr3d Motion Blur</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      #ui {
        position: absolute;
        top: 12px;
        left: 12px;
        z-index: 10;
        display: inline-flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 4px 10px;
        max-width: calc(100vw - 24px);
        padding: 4px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 6px;
        background: rgba(15, 20, 28, 0.8);
        color: #f4f7fb;
        font:
          13px/1.2 system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
        backdrop-filter: blur(8px);
      }
      #ui .group {
        display: inline-flex;
        gap: 4px;
      }
      #ui label {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        min-height: 32px;
        padding: 0 4px;
        white-space: nowrap;
      }
      #ui input[type='range'] {
        width: min(110px, 28vw);
      }
      #ui output {
        min-width: 32px;
        color: #9ed0ff;
        font-variant-numeric: tabular-nums;
      }
      #ui button {
        min-width: 72px;
        min-height: 32px;
        padding: 0 12px;
        border: 1px solid transparent;
        border-radius: 4px;
        background: transparent;
        color: inherit;
        cursor: pointer;
        font: inherit;
        font-weight: 600;
        white-space: nowrap;
      }
      #ui button:hover {
        background: rgba(255, 255, 255, 0.1);
      }
      #ui button.active {
        border-color: rgba(125, 186, 255, 0.7);
        background: #2f6fc5;
      }
      #ui button:focus-visible {
        outline: 2px solid #9ed0ff;
        outline-offset: 2px;
      }
      #status {
        position: absolute;
        right: 12px;
        bottom: 12px;
        z-index: 10;
        padding: 6px 9px;
        border-radius: 4px;
        background: rgba(15, 20, 28, 0.78);
        color: #b9d9f8;
        font:
          12px/1.2 system-ui,
          sans-serif;
      }
      #status.error {
        color: #ffb3aa;
      }
      @media (max-width: 420px) {
        #ui {
          left: 8px;
          right: 8px;
          max-width: none;
        }
        #ui button {
          flex: 1;
          min-width: 0;
          padding: 0 8px;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="my-canvas"></canvas>
    <div id="ui" aria-label="Motion Blur">
      <div class="group">
        <button id="btn-off" type="button" aria-pressed="false">Blur Off</button>
        <button id="btn-on" class="active" type="button" aria-pressed="true">Blur On</button>
      </div>
    </div>
    <div id="status" aria-live="polite" hidden></div>
    <script type="module" src="js/tut-73.js"></script>
  </body>
</html>
