<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zephyr3d Input Actions</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
      }
      #ui {
        position: absolute;
        top: 8px;
        left: 8px;
        z-index: 10;
        display: flex;
        flex-direction: column;
        gap: 6px;
        width: 232px;
        padding: 8px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 6px;
        background: rgba(15, 20, 28, 0.78);
        color: #f4f7fb;
        color-scheme: dark;
        font:
          12px/1.25 system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
        backdrop-filter: blur(8px);
      }
      #ui label {
        display: flex;
        align-items: center;
        gap: 6px;
        white-space: nowrap;
      }
      #ui label > span {
        min-width: 70px;
      }
      #ui select {
        flex: 1;
        min-width: 0;
        min-height: 22px;
        padding: 0 4px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 4px;
        background: #222b36;
        color: inherit;
        font: inherit;
        cursor: pointer;
      }
      #ui option {
        background: #1b2430;
        color: #f4f7fb;
      }
      #ui input[type='checkbox'] {
        accent-color: #7fb2ff;
        cursor: pointer;
      }
      #ui input[type='range'] {
        flex: 1;
        min-width: 0;
        accent-color: #7fb2ff;
        cursor: pointer;
      }
      #ui em {
        min-width: 48px;
        text-align: right;
        font-style: normal;
        opacity: 0.85;
      }
      #ui .note {
        opacity: 0.7;
        white-space: normal;
      }
      #ui button {
        min-height: 24px;
        padding: 0 8px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 4px;
        background: #2a3646;
        color: inherit;
        font: inherit;
        cursor: pointer;
      }
      #ui button:hover {
        background: #34445a;
      }
      #ui .row {
        display: flex;
        gap: 6px;
      }
      #ui .row > button {
        flex: 1;
      }
      #ui pre {
        font:
          11px/1.3 ui-monospace,
          monospace;
        opacity: 0.85;
      }
      #paused {
        display: none;
        position: absolute;
        inset: 0;
        z-index: 20;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.45);
        color: #fff;
        font:
          600 32px system-ui,
          sans-serif;
        letter-spacing: 0.2em;
      }
    </style>
  </head>
  <body>
    <canvas id="my-canvas" tabindex="0"></canvas>
    <div id="ui" aria-label="Zephyr3d Input Actions">
      <label><span>Device</span><em id="device"></em></label>
      <label><span>Map</span><em id="map"></em></label>
      <label><span>Speed</span><em id="speed"></em></label>
      <pre id="values"></pre>
      <div class="note" id="help"></div>
    </div>
    <div id="paused">PAUSED</div>
    <script type="module" src="js/tut-85.js"></script>
  </body>
</html>
