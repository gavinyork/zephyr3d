<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zephyr3d Particles and Sprites</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
      }
      #ui {
        position: absolute;
        top: 8px;
        left: 8px;
        z-index: 10;
        display: flex;
        flex-direction: column;
        gap: 6px;
        width: 210px;
        padding: 8px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 6px;
        background: rgba(15, 20, 28, 0.78);
        color: #f4f7fb;
        /* Render the native dropdown popup and its scrollbar dark to match. */
        color-scheme: dark;
        font:
          12px/1.25 system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
        backdrop-filter: blur(8px);
      }
      #ui label {
        display: flex;
        align-items: center;
        gap: 6px;
        white-space: nowrap;
      }
      #ui label > span {
        min-width: 72px;
      }
      #ui select {
        flex: 1;
        min-width: 0;
        min-height: 22px;
        padding: 0 4px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 4px;
        /* Opaque: the popup list has nothing behind it, so a translucent
           background composites onto white and hides the inherited light text. */
        background: #222b36;
        color: inherit;
        font: inherit;
        cursor: pointer;
      }
      #ui option {
        background: #1b2430;
        color: #f4f7fb;
      }
      #ui input[type='checkbox'] {
        accent-color: #7fb2ff;
        cursor: pointer;
      }
      #ui button {
        min-height: 24px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 4px;
        background: #2d3a4a;
        color: inherit;
        font: inherit;
        cursor: pointer;
      }
      #ui button:hover {
        background: #3a4b60;
      }
      #ui .note {
        opacity: 0.7;
        white-space: normal;
      }
    </style>
  </head>
  <body>
    <canvas id="my-canvas"></canvas>
    <div id="ui" aria-label="Particle system options">
      <label>
        <span>Shape</span>
        <select id="shape-select">
          <option value="point">Point</option>
          <option value="sphere">Sphere</option>
          <option value="hemisphere">Hemisphere</option>
          <option value="box">Box</option>
          <option value="cone">Cone</option>
          <option value="circle">Circle</option>
          <option value="edge">Edge</option>
        </select>
      </label>
      <label>
        <span>Spawn</span>
        <select id="behavior-select">
          <option value="surface">Surface</option>
          <option value="volume">Volume</option>
        </select>
      </label>
      <label>
        <span>Blend</span>
        <select id="blend-select">
          <option value="additive">Additive</option>
          <option value="blend">Alpha blend</option>
        </select>
      </label>
      <label>
        <span>World space</span>
        <input id="world-check" type="checkbox" checked />
      </label>
      <label>
        <span>Continuous</span>
        <input id="continuous-check" type="checkbox" checked />
      </label>
      <label>
        <span>Weighted OIT</span>
        <input id="oit-check" type="checkbox" />
      </label>
      <button id="burst-button" type="button">Burst</button>
      <div class="note">Left drag: orbit. Wheel: zoom.</div>
    </div>
    <script type="module" src="js/tut-90.js"></script>
  </body>
</html>
