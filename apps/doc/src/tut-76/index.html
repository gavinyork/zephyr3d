<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zephyr3d Rigid Bodies</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
      }
      #ui {
        position: absolute;
        top: 8px;
        left: 8px;
        z-index: 10;
        display: flex;
        flex-direction: column;
        gap: 6px;
        width: 232px;
        padding: 8px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 6px;
        background: rgba(15, 20, 28, 0.78);
        color: #f4f7fb;
        color-scheme: dark;
        font:
          12px/1.25 system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
        backdrop-filter: blur(8px);
      }
      #ui label {
        display: flex;
        align-items: center;
        gap: 6px;
        white-space: nowrap;
      }
      #ui label > span {
        min-width: 70px;
      }
      #ui select {
        flex: 1;
        min-width: 0;
        min-height: 22px;
        padding: 0 4px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 4px;
        background: #222b36;
        color: inherit;
        font: inherit;
        cursor: pointer;
      }
      #ui option {
        background: #1b2430;
        color: #f4f7fb;
      }
      #ui input[type='checkbox'] {
        accent-color: #7fb2ff;
        cursor: pointer;
      }
      #ui input[type='range'] {
        flex: 1;
        min-width: 0;
        accent-color: #7fb2ff;
        cursor: pointer;
      }
      #ui em {
        min-width: 48px;
        text-align: right;
        font-style: normal;
        opacity: 0.85;
      }
      #ui .note {
        opacity: 0.7;
        white-space: normal;
      }
      #ui button {
        min-height: 24px;
        padding: 0 8px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 4px;
        background: #2a3646;
        color: inherit;
        font: inherit;
        cursor: pointer;
      }
      #ui button:hover {
        background: #34445a;
      }
      #ui .row {
        display: flex;
        gap: 6px;
      }
      #ui .row > button {
        flex: 1;
      }
    </style>
  </head>
  <body>
    <canvas id="my-canvas" tabindex="0"></canvas>
    <div id="ui" aria-label="Zephyr3d Rigid Bodies options">
      <div class="row">
        <button id="drop">Drop more</button>
        <button id="reset">Reset</button>
      </div>
      <div class="note">
        Boxes and balls fall onto a static ground and ramp. Left drag: orbit. Wheel: zoom.
      </div>
    </div>
    <script type="module" src="js/tut-76.js"></script>
  </body>
</html>
