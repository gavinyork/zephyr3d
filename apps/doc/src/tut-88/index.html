<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zephyr3d test</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
      }
      /* Part of the page, so it shows before the engine modules have loaded */
      #loading {
        position: absolute;
        inset: 0;
        z-index: 20;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        background: #11161d;
        color: #f4f7fb;
        font: 13px/1.2 system-ui, sans-serif;
        transition: opacity 0.3s ease;
      }
      #loading.done {
        opacity: 0;
        pointer-events: none;
      }
      #loading-bar {
        width: min(240px, 60vw);
        height: 3px;
        border-radius: 2px;
        background: rgba(255, 255, 255, 0.15);
        overflow: hidden;
      }
      #loading-bar[hidden] {
        display: none;
      }
      #loading-bar > div {
        width: 0;
        height: 100%;
        background: #2f6fc5;
        transition: width 0.2s ease-out;
      }
      #loading-message {
        min-height: 1.2em;
        opacity: 0.7;
      }
    </style>
  </head>
  <body>
    <canvas id="my-canvas"></canvas>
    <div id="loading" role="status" aria-live="polite">
      <div id="loading-bar" hidden><div></div></div>
      <div id="loading-message">Loading</div>
    </div>
    <!-- The scene script imports the engine by name; map it to the bundles this page loads -->
    <script type="importmap">
      {
        "imports": {
          "@zephyr3d/base": "./lib/zephyr3d-base.js",
          "@zephyr3d/device": "./lib/zephyr3d-device.js",
          "@zephyr3d/scene": "./lib/zephyr3d-scene.js"
        }
      }
    </script>
    <script type="module" src="js/tut-88.js"></script>
  </body>
</html>
