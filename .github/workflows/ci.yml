name: CI
on:
  push:
    branches: ['main', 'develop']
  pull_request:
    branches: ['main', 'develop']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.23.0

      - name: Rush Update
        run: node common/scripts/install-run-rush.js update

      - name: Rush Build
        run: node common/scripts/install-run-rush.js rebuild --verbose

      # The jest suites were never actually run in CI before this. They cover
      # maths, render-graph topology, serialization and shader codegen - 70
      # suites, ~1500 assertions, well under a minute.
      #
      # Gating, not advisory. This step first ran against four pre-existing
      # failures, all of which turned out to be worth having found: a
      # doubleSidedLighting default that silently loaded legacy materials as
      # single-sided, two assertions still pinned to the hard morph-target
      # ceiling after a configurable limit was introduced below it, and morph
      # displacement being dropped from the bounds of meshes that are both
      # skinned and morphed.
      - name: Unit tests
        run: node common/scripts/install-run-rush.js test

  visual:
    # Pixel regression against committed SwiftShader baselines. Split from the
    # build job because it needs a browser download and produces artifacts, and
    # because a pixel diff should be readable on its own rather than buried in a
    # build log.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.23.0

      - name: Rush Update
        run: node common/scripts/install-run-rush.js update

      - name: Build engine and harness
        run: node common/scripts/install-run-rush.js build -t @zephyr3d/visual-test --verbose

      # `channel: 'chromium'` in playwright.config.ts needs the full Chromium
      # build: the default headless-shell exposes navigator.gpu but its
      # requestAdapter() always resolves to null, so WebGPU is unusable there.
      - name: Install Chromium
        run: npm run install-browser --prefix ./visual-test

      # Digests are committed, reference images live in a separate public store.
      # A commit whose digests point at images nobody pushed would still gate
      # correctly, but a failure in it could not show the expected image, so it
      # is rejected here rather than discovered on the first red run.
      - name: Check reference images are published
        run: npm run baselines:check --prefix ./visual-test

      # Reference images are only read when a capture misses its digest. Keyed on
      # the digests so an unchanged set downloads nothing.
      - name: Cache reference images
        uses: actions/cache@v4
        with:
          path: visual-test/.baseline-cache/images
          key: visual-baselines-${{ hashFiles('visual-test/digests/*.json') }}
          restore-keys: visual-baselines-

      # test:only rather than test - the harness bundle was already built by the
      # rush step above, and rebuilding it here would just be slower.
      - name: Visual regression (SwiftShader gate)
        run: npm run test:only --prefix ./visual-test
        env:
          VISUAL_CAPTURES_DIR: ${{ github.workspace }}/visual-test/captures

      # Every capture that missed its digest, with its digest and environment.
      # Uploaded on success too: a tolerant match is a pass whose digest is stale.
      # `npm run baselines:update-from-ci -- <run-id>` accepts them for linux-x64.
      - name: Upload captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-captures
          path: visual-test/captures
          if-no-files-found: ignore
          retention-days: 14

      # Uploaded on failure only, and this is the whole point of the job: the
      # report embeds the expected/actual/diff PNGs per failing scene.
      - name: Upload diff report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-report
          path: |
            visual-test/playwright-report
            visual-test/test-results
          retention-days: 14
