<!doctype html>
<html lang="en">
  <head>
    <meta http-equiv="Content-Type" content="text/html;charset=utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />

      http-equiv="origin-trial"

    />
    <title>Zephyr3d examples</title>
    <style>
      * {
        box-sizing: border-box;
      }

      .fullpage {
        position: fixed;
        left: 0;
        top: 0;
        right: 0;
        bottom: 0;
        margin: 0;
      }

      .flex-row {
        display: flex;
        flex-flow: row nowrap;
      }

      .flex-col {
        display: flex;
        flex-flow: column nowrap;
      }

      .nav {
        position: relative;
        left: 0;
        flex: 1 1;
        max-width: 300px;
        height: 100vh;
        overflow: auto;
        background: #fafafa;
        padding: 0 15px;
        color: #045b88;
      }

      .maximized {
        flex-grow: 1;
      }

      .fit {
        flex-shrink: 1;
      }

      li {
        list-style: none;
        padding: 3px;
        cursor: pointer;
      }

      a {
        text-decoration: none;
      }

      .active {
        color: red;
      }

      .title {
        text-align: center;
        font-family: 'Segoe UI Light', 'Segoe UI', 'Trebuchet MS', Tahoma, Arial, Helvetica;
        font-weight: lighter;
      }
    </style>
  </head>

  <body class="fullpage flex-col">
    <div class="flex-row maximized fit">
      <nav class="flex-col nav" style="padding: 15px; width: 300px">
        <h1 class="title">Zephyr3d tests</h1>
        <label for="device-type" style="color: black">select device:</label>
        <select id="device-type" style="padding: 3px; margin: 0px 10px 0px 0px; outline: none">
          <option value="webgl" selected>WebGL</option>
          <option value="webgl2">WebGL2</option>
          <option value="webgpu">WebGPU</option>
        </select>
        <ul class="maximized fit" style="text-align: left; overflow: auto; padding: 0"></ul>
      </nav>
      <iframe class="maximized fit" style="border-width: 0" title="render window" scrolling="no"></iframe>
    </div>
    <script type="module">
      import examples from './examples.js';

      const iframe = document.querySelector('iframe');
      const selectDevice = document.querySelector('select');
      const list = document.querySelector('ul');

      const openExample = function (id) {
        const query = new URLSearchParams({ dev: selectDevice.value, device: selectDevice.value });
        iframe.src = `${id}/index.html?${query}`;
        const links = document.querySelectorAll('a[data-example]');
        for (const link of links) {
          link.classList.toggle('active', link.dataset.example === id);
        }
      };

      for (const example of examples) {
        const item = document.createElement('li');
        const link = document.createElement('a');
        link.href = `#${example.id}`;
        link.dataset.example = example.id;
        link.textContent = example.title;
        item.append(link);
        list.append(item);
      }

      const openSelectedExample = function () {
        const requested = decodeURIComponent(location.hash.slice(1));
        const selected = examples.find((example) => example.id === requested) || examples[0];
        if (selected) {
          openExample(selected.id);
        }
      };

      selectDevice.addEventListener('change', function () {
        openSelectedExample();
      });
      window.addEventListener('hashchange', openSelectedExample);
      openSelectedExample();
    </script>
  </body>
</html>
