<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Zephyr3d Editor</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      html,
      body {
        width: 100vw;
        height: 100vh;
      }
      canvas {
        display: block;
        touch-action: none;
        overscroll-behavior: contain;
        overflow: hidden;
        outline: none;
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
      }
      canvas:focus {
        outline: none;
      }
      #zephyr-loading {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #1f1f1f;
        color: #d8d8d8;
        font: 14px 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        z-index: 10;
      }
    </style>
    <script type="importmap">
__ZEPHYR3D_IMPORT_MAP__
    </script>
  </head>
  <body>
    <div id="zephyr-loading" role="status" aria-live="polite">Loading Zephyr3D Editor...</div>
    <canvas id="canvas"></canvas>
    <script>
      // Module parse/load failures happen before app.ts can install its
      // renderer handlers; surface them instead of leaving the loading mask.
      const showStartupError = (message) => {
        const loading = document.getElementById('zephyr-loading');
        if (loading) {
          loading.textContent = `Editor startup failed: ${message}`;
          loading.setAttribute('role', 'alert');
        }
      };
      window.addEventListener('error', (event) => {
        if (event.message) {
          showStartupError(event.message);
        }
      });
      window.addEventListener('unhandledrejection', (event) => {
        showStartupError(event.reason?.message || String(event.reason || 'Unhandled promise rejection'));
      });
    </script>
    <script>
      // Select the engine depth convention before any engine module loads.
      const params = new URLSearchParams(location.search);
      if (params.has('standardZ')) {
        globalThis.__ZEPHYR3D_REVERSE_Z__ = false;
      } else if (params.has('reverseZ')) {
        globalThis.__ZEPHYR3D_REVERSE_Z__ = true;
      }
    </script>
    <script src="/vendor/typescript.js"></script>
    <script src="/vendor/draco_decoder.js"></script>
    <script type="module" src="/src/monaco-init.ts"></script>
    <script type="module" src="/src/app.ts"></script>
  </body>
</html>
